<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zhu Lida</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
      padding: 3rem 1.5rem;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1.6rem;
      border: 4px solid #fff;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: #0d1117;
    }

    .subtitle {
      font-size: 1.15rem;
      color: #555;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .about {
      font-size: 1.05rem;
      color: #444;
      margin: 0 auto 2.5rem;
      max-width: 560px;
      line-height: 1.7;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.4rem;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: #0d1117;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.98rem;
      transition: all 0.22s ease;
      border: 1px solid #0d1117;
    }

    .btn:hover {
      background: #21262d;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }

    .btn.outline {
      background: transparent;
      color: #0d1117;
    }

    .btn.outline:hover {
      background: rgba(0,0,0,0.04);
    }

    footer {
      padding: 2rem 1rem;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
    }

    @media (max-width: 480px) {
      .container {
        padding: 2.5rem 1.2rem;
        margin: 1rem;
      }
      h1 { font-size: 1.9rem; }
      .subtitle { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<main>
  <div class="container">
    <!-- 建议准备一张正方形头像，推荐尺寸 400×400 或更高 -->
    <img src="https://avatars.githubusercontent.com/u/2616502?v=4" 
         alt="Zhu Lida" class="avatar">

    <h1>Zhu Lida</h1>
    <div class="subtitle">iOS Developer</div>

    <p class="about">
      <!-- iOS Developer -->
    </p>

  </div>
</main>

<footer>

</body>
</html>
